# Trusted publishing to PyPI. Does not run on push/PR — only when a
# GitHub Release is published (which tags the repo, e.g. v0.1.0).
#
# Before the first release, configure a Trusted Publisher on PyPI for
# this repository: environment name "pypi", workflow "publish.yml".
# Do not store a PyPI token in GitHub secrets.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/obfcm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
