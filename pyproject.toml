[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obfcm"
version = "0.1.0"
description = "Read EU-mandated OBFCM lifetime fuel and distance counters (SAE J1979 InfoType 17)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "obfcm contributors"}]
keywords = ["obd", "obfcm", "elm327", "j1979", "fuel", "lifetime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Anush-aj/obfcm"
Repository = "https://github.com/Anush-aj/obfcm"
Issues = "https://github.com/Anush-aj/obfcm/issues"

[tool.hatch.build.targets.wheel]
packages = ["obfcm"]
